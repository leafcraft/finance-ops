# finance-ops — Finance-Operations Pod (AP / AR / month-end close)
#
# A pod of five digital employees + four human roles that runs a payable
# end to end: invoice arrives -> extracted (confidence-scored, AP/AR/close
# classified) -> duplicate + fraud screen -> matched + GL-coded (form built,
# cross-checked) -> approval tier (clerk / controller / CFO) -> posted to the
# ERP -> live status. Above $500K an entry needs two signers (CFO first, then
# the Controller) before it posts. The month-end close sweep fans the same
# intake across the aging backlog.
#
# The pod is a TEAM, not a pipeline. Every wire is conditional; every hand-off
# is a finished contract; nothing is approved or posted on silence; the
# finisher posts the real entry and fails closed; the WORM sink is the terminus.
# Systems (email / vendor portal / ERP) are TOOLS inside agents, never members.
#
# Design doctrine: .claude/skills/leafmesh/building-agents-thoroughly.md
# Field reference:  .claude/skills/leafmesh/agent-config-fields.md
# SDK gotchas:      .claude/skills/leafmesh/nuances-and-gotchas.md

name: "finance-ops"
version: 1.0.0
architecture: managed_mesh
environment: development
debug: true
log_level: INFO

auto_discover:
  directory: ./agency
  pattern: '*_agent.py'

# The Manager is the SUPERVISOR. It escalates to the Finance-Ops Lead when an
# agent fails with an error that a retry cannot fix (auth, bad request, credit,
# bad config), when 5 different agents fail in one session, or when restarts
# run out. A broken hand-off contract only raises an alert. It does not chase
# an unanswered approval. It is not a router in the middle of the team.
manager:
  model: gpt-4o-mini
  domain: generic
  prompt: |
    This mesh runs accounts payable, accounts receivable, and the month-end
    close. A successful invoice flows arrival -> Ivy (extract, confidence-scored,
    AP/AR/close classified) -> Ray (duplicate + fraud screen) -> Mat (PO/3-way
    match + GL coding, cross-checked) -> the right approval tier (AP clerk /
    Controller / CFO; above $500K the CFO and then the Controller) -> Poe (post
    to the ERP), and Cora keeps live status. Policy flags, possible duplicates
    and a re-match that is still wrong after one retry go to the Finance-Ops
    Lead on the agents' own wires. Nothing is approved or posted on silence.
  routing:
    mode: static
  escalation:
    targets:
      - type: human_agent
        agent: finance_ops_lead_human
    auto_escalate:
      max_retries: 3
      max_errors_per_session: 5

# 2.4.131 runtime block — the ONE non-default this pod genuinely needs:
# extracting a dense multi-line invoice (and a fanned close sweep) can run long.
# Everything else stays default (omission is meaningful; we do not pre-fill
# defaults). NOTE: `timeouts` is rejected by <=2.4.130 — it must land WITH the
# 2.4.131 floor, never before.
timeouts:
  mesh_call_default_timeout_s: 150
  llm_hard_timeout_s: 300

# ── Entry points — one per real-world trigger ────────────────────────────────
entry_points:
  - name: email_invoice
    target: invoice_intake_agent
    description: "A vendor emails an invoice to AP@ — Ivy opens the case and extracts."
    condition: always
  - name: portal_invoice
    target: invoice_intake_agent
    description: "A vendor uploads via the supplier portal — Ivy extracts."
    condition: always
  - name: erp_webhook
    target: invoice_intake_agent
    description: "The ERP raises an 'invoice received' webhook — Ivy extracts."
    condition: always
  - name: new_invoice
    target: fin_coordinator_agent
    description: "AP keys an invoice in manually — Cora opens the case and orchestrates."
    condition: always
  - name: invoice_status
    target: fin_coordinator_agent
    description: "Anyone asks 'where is this invoice / payment?' — Cora answers from the case record."
    condition: always
  - name: daily_close_sweep
    target: invoice_intake_agent
    description: "Scheduled month-end sweep — Ivy fans across the aging / unposted backlog."
    condition: always
  - name: approver_reply
    target: ap_clerk_human
    description: "HITL resume — an AP clerk answers Ivy's question or signs off a coding sheet."
    condition: always

agents:

  # ─────────────────────────────────────────────────────────────────────────
  # Cora — Finance-Ops Coordinator (AI). Owns the case end to end: opens it,
  # orchestrates the pod, keeps live status, is the requester's one contact.
  # Pure orchestration — never extracts, never codes, never approves. (Pure YAML.)
  # ─────────────────────────────────────────────────────────────────────────
  fin_coordinator_agent:
    name: fin_coordinator_agent
    communication_type: chain
    agent_type: llm
    model: gpt-4o-mini
    temperature: 0.1
    description: "Finance-Ops Coordinator — opens the case, orchestrates, keeps status, single point of contact."
    prompt: |
      You are Cora, the Finance-Ops Coordinator. You OWN each invoice from the
      moment it arrives to the moment it is posted. You orchestrate the pod and
      keep the requester informed — you never extract an invoice, code an entry,
      or approve anything yourself.

      On a new invoice: open a case, record the arrival time, hand it to Ivy for
      extraction. On a status ask: answer current stage / waiting-on / next gate
      from the case record — nothing invented. Route any specialist's exception
      to the Finance-Ops Lead; never make the policy call yourself.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": ..., "invoice_id": ..., "stage": ..., "waiting_on": ..., "summary": ...}
    yields:
      action: "string"        # open_case | status | escalate
      invoice_id: "string"
      stage: "string"
      waiting_on: "string"
      summary: "string"
    can_call:
      - agent: invoice_intake_agent
        condition: "calling_agent_response.action == 'open_case'"
      - agent: finance_ops_lead_human
        condition: "calling_agent_response.action == 'escalate'"

  # ─────────────────────────────────────────────────────────────────────────
  # Ivy — Invoice Intake & Extraction Analyst (AI, Super-Agent). Reads every
  # invoice with a per-field confidence score, classifies the lane (AP / AR /
  # close item), and runs the policy pre-check. This is where "zero data-entry
  # errors" is won: a field it cannot read with confidence becomes a QUESTION to
  # the AP clerk, never a guess into a coding sheet. Loops its tools (read
  # sources) until the extract is CLEAN, then hands verified line-items to Ray /
  # Mat (contract). super_agent = autonomous plan/execute/verify across a dense
  # invoice; @chain = the confidence floor (fail closed). scaling.copies = the close
  # sweep fans the SAME analyst across the aging backlog, each copy claiming a
  # disjoint invoice via the atomic claim tool.
  # ─────────────────────────────────────────────────────────────────────────
  invoice_intake_agent:
    name: invoice_intake_agent
    communication_type: chain
    agent_type: llm
    model: claude-sonnet-4-6
    temperature: 0.1
    max_tool_calls_per_message: 15   # a dense invoice + backlog claim; default 5 truncates silently
    description: "Invoice Intake & Extraction Analyst — reads each invoice with confidence, classifies AP/AR/close, policy pre-check."
    # Scheduled month-end sweep — in the company's timezone (NOT UTC). Also
    # reachable via the daily_close_sweep entry point. Set `timezone` to yours.
    wake_up: "0 6 * * *"
    timezone: "Asia/Kolkata"
    wake_up_input:
      trigger: daily_close_sweep
    super_agent:                     # dict form = the tuning path (2.4.123+)
      cost_ceiling: 120000
      wall_clock: 900
    # Backlog fan-out — one activation, N copies, each claims a DISJOINT invoice
    # from the sweep backlog via claim_next_invoice (atomic). `each` routes every
    # copy on its OWN yields (so each claimed invoice flows independently — a
    # per-invoice request simply has copies 2..N claim nothing and route nothing).
    # For a pure one-invoice-at-a-time deployment, set copies.count: 1.
    scaling:                      # 2.4.484 (was instances / instances_handoff)
      copies:
        mode: fixed
        count: 3
        handoff: each
    prompt: |
      You are Ivy, the Invoice Intake & Extraction Analyst. Your job is to turn a
      raw invoice into confidence-scored, source-traced line-items — and to
      REFUSE to guess. Read the invoice from email, the supplier portal, or the
      ERP webhook payload. On a close sweep, call claim_next_invoice to pull ONE
      unclaimed invoice from the backlog before you read anything. Read each line
      for description, quantity, unit price, amount, tax, with a confidence score
      on every field. Classify the lane (ap_invoice / ar_invoice / close_item)
      and run the policy pre-check.

      NEVER invent an amount, vendor, PO, or date no source shows. A field you
      cannot read with confidence is one targeted QUESTION to the AP clerk, not a
      coding-sheet entry. Route policy ambiguity or a possible duplicate to the
      Finance-Ops Lead. Hand verified line-items on ONLY when the extract is
      clean. Load the `ap_intake` / `ar_intake` / `close_sweep` playbook for the
      exact read-before-write order for the lane you are in.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"extract_clean": ..., "doc_class": ..., "low_confidence_fields": ...,
       "policy_flags": ..., "line_items": ..., "invoice_id": ..., "vendor_id": ...,
       "amount_cents": ..., "po_number": ..., "due_date": ..., "anomaly_risk": ...,
       "question_for_reviewer": ...}
    yields:
      extract_clean: "boolean"
      doc_class: "string"            # ap_invoice | ar_invoice | close_item
      low_confidence_fields: {type: array, items: string}   # field names, e.g. "line_2.amount"
      policy_flags: {type: array, items: string}            # e.g. "first_time_vendor"
      line_items: {type: array, items: object}              # one object per invoice line (sku, description, quantity, unit_price, total, <field>_confidence)
      invoice_id: "string"
      vendor_id: "string"
      amount_cents: "number"
      po_number: "string"
      due_date: "string"
      anomaly_risk: "boolean"        # round-number / first-time vendor / >=$10K — re-asserted by the floor
      question_for_reviewer: "string"
    # Playbook — the CRAFT, fetched on demand. Only `description` rides in the
    # prompt; `responsibility` is loaded when the model recognises the lane.
    playbook:
      - intent: ap_intake
        description: "How to read a vendor bill (accounts payable) correctly and score every field."
        responsibility: |
          1. Pull the source FIRST (read_invoice_sources for the event, then
             read_po_context if a PO is cited) before scoring anything — you
             cannot classify a bill you have not fully read.
          2. Read each line for description, quantity, unit price, amount, tax.
             Score EVERY field 0-1. Keep amounts in integer cents; never alter a
             documented amount.
          3. Resolve vendor_id ONLY from a vendor-master match — never guess it.
          4. Any field below 0.85 confidence becomes ONE targeted question to the
             AP clerk — never a silent guess.
        variables: [invoice_id]
      - intent: ar_intake
        description: "How to read a customer invoice (accounts receivable) we are issuing/collecting."
        responsibility: |
          1. Read customer, amount, terms, and the revenue lines; score each.
          2. Flag revenue-recognition items (multi-period, milestone) into
             policy_flags for the Finance-Ops Lead — do not net or defer yourself.
          3. Set doc_class = ar_invoice so downstream coding uses AR accounts.
        variables: [invoice_id]
      - intent: close_sweep
        description: "How to sweep the aging / unposted backlog at month-end close."
        responsibility: |
          1. Call claim_next_invoice FIRST to pull one unclaimed backlog item;
             if it returns available:false, there is nothing left — stop.
          2. Extract exactly as ap_intake / ar_intake for that one item.
          3. Flag anything that would miss the close cut-off into policy_flags.
        variables: [invoice_id]
      - intent: policy_precheck
        description: "How to check an invoice against AP policy before it is coded."
        responsibility: |
          1. Re-assert the routing flags policy demands (you may RAISE, never
             lower): >=$10K, a first-time / unresolved vendor, or a round-thousand
             amount all set anomaly_risk = true.
          2. Flag anything out of policy — do NOT waive it; route it to the
             Finance-Ops Lead via policy_flags.
        variables: [invoice_id, doc_class]
    # Day-0 tool surface — reads the seed source store so the pod runs with NO
    # connector wired. Each tool has a dev-store fallback and announces itself
    # (available:false) when it has no real source. See agency/tools.py.
    tools: [read_invoice_sources, read_po_context, list_prior_invoices, claim_next_invoice]
    tool_categories: [intake]
    # ── To wire real email / ERP: create the vault connections 'erp_mcp' and
    #    'mail_mcp' on Infrastructure → Integrations → MCP (each an MCP server's
    #    connection: its address + token), then uncomment — here before the first
    #    start, in Studio's YAML editor after it (applies live, no restart). Each named action
    #    under `use:` becomes its own tool, e.g. erp_read_invoice. The address
    #    and token live only in the vault — never write url:/token: here. ──
    # mcp:
    #   - connection: erp_mcp
    #     transport: http
    #     use: [read_invoice, read_po, read_goods_receipt]
    #     name: erp
    #     timeout: 30
    #   - connection: mail_mcp
    #     transport: http
    #     use: [read_messages, read_attachments]
    #     name: mail
    #     timeout: 30
    can_call:
      - agent: ap_clerk_human
        condition: "calling_agent_response.extract_clean == false and calling_agent_response.question_for_reviewer != ''"
      - agent: finance_ops_lead_human
        condition: "calling_agent_response.policy_flags != []"
      - agent: payment_risk_agent
        condition: "calling_agent_response.extract_clean == true and calling_agent_response.anomaly_risk == true"
      - agent: matching_gl_agent
        condition: "calling_agent_response.extract_clean == true and calling_agent_response.anomaly_risk == false"

  # ─────────────────────────────────────────────────────────────────────────
  # Ray — Payment-Risk Officer (AI). ONE risk desk: the duplicate ledger
  # pre-flight AND the fraud/anomaly verdict. The LLM writes the narrative;
  # agency/payment_risk_agent.py owns the deterministic floor the model cannot
  # waive — SHA-256 dedupe (strict = vendor+invoice_id; loose =
  # vendor+amount+due_date) against the posted ledger. A hit FORCES is_duplicate
  # + fraud_score >= 0.85 + controller_review; a duplicate is never silent-dropped.
  # ─────────────────────────────────────────────────────────────────────────
  payment_risk_agent:
    name: payment_risk_agent
    communication_type: chain
    agent_type: llm
    model: gpt-4o-mini
    temperature: 0.1
    description: "Payment-Risk Officer — duplicate ledger pre-flight + fraud/anomaly verdict using vendor history."
    prompt: |
      You are Ray, the Payment-Risk Officer. Every invoice that smells wrong
      lands on your desk. Two jobs, one pass:

      1. DUPLICATE CHECK — compare this invoice against the vendor's posted
         history (list_prior_invoices is pulled for you into the deterministic
         floor). If it is a re-submission, say so; never silent-drop a duplicate.
      2. FRAUD VERDICT — score the invoice 0-1. NEVER score >= 0.7 on a single
         signal; cite at least two flagged_signals or cap at 0.55. A confirmed
         duplicate is the one exception and stands alone.

      recommendation: fraud_score < 0.4 -> "pass"; 0.4 <= score < 0.7 -> "flag";
      score >= 0.7 -> "controller_review". Write a 3-5 sentence briefing whenever
      you recommend controller_review — a Controller reads it to defend the call
      in an audit. The dedupe floor may RAISE your score on a confirmed duplicate;
      it never lowers it.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"fraud_score": ..., "flagged_signals": ..., "is_duplicate": ...,
       "duplicate_of_invoice_id": ..., "recommendation": ..., "briefing": ...}
    yields:
      fraud_score: "number"          # 0..1
      flagged_signals: {type: array, items: string}   # e.g. "round_number", "bank_details_changed"
      is_duplicate: "boolean"
      duplicate_of_invoice_id: "string"
      recommendation: "string"       # pass | flag | controller_review
      briefing: "string"
    inputs:
      invoice_id: "string"
      vendor_id: "string"
      amount_cents: "number"
      due_date: "string"
    can_call:
      - agent: controller_human
        condition: "calling_agent_response.fraud_score >= 0.7 or calling_agent_response.is_duplicate == true"
      - agent: finance_ops_lead_human
        condition: "calling_agent_response.fraud_score >= 0.4 and calling_agent_response.fraud_score < 0.7"
      - agent: matching_gl_agent
        condition: "calling_agent_response.fraud_score < 0.4 and calling_agent_response.is_duplicate == false"

  # ─────────────────────────────────────────────────────────────────────────
  # Mat — Matching & GL-Coding Builder (AI + finisher-lite). Turns Ivy's verified
  # line-items into a coded entry: PO / 3-way match against the ERP, GL account +
  # cost center per the chart, then a cross-check that totals tie out and the GL
  # account is ACTIVE. Deliberately SEPARATE from Ivy (the reader is not the
  # coder — a second pass catches what the first missed). Renders the draft
  # coding sheet to ./out (@chain cross-check floor, fail closed). The APPROVAL
  # MATRIX rides its outbound wires — explicit, auditable by reading this file.
  # ─────────────────────────────────────────────────────────────────────────
  matching_gl_agent:
    name: matching_gl_agent
    communication_type: chain
    agent_type: llm
    model: claude-sonnet-4-6
    temperature: 0.1
    description: "Matching & GL-Coding Builder — PO/3-way match + GL coding, cross-checks totals, renders the coding sheet."
    prompt: |
      You are Mat, the Matching & GL-Coding Builder. Turn Ivy's verified
      line-items into a coded entry against the company's chart of accounts —
      same chart, no invented accounts. Match the invoice to its PO (and the
      goods receipt when a 3-way match is required); the deterministic floor pulls
      the PO and does the tolerance arithmetic for you. Assign gl_account and
      cost_center; prefer the vendor's standing default. Cross-check that the
      line-items tie out to the stated total and that the GL account is active
      BEFORE anyone sees the sheet. If a check fails, return it to Ivy with the
      specific discrepancy — never force the numbers to balance. Load the
      `code_entry` playbook for the assembly + cross-check order.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"match_ok": ..., "cross_check_ok": ..., "discrepancy": ...,
       "gl_account": ..., "cost_center": ..., "confidence": ...,
       "invoice_id": ..., "vendor_id": ..., "amount_cents": ...,
       "anomaly_risk": ..., "artifact_path": ..., "match_retry_exhausted": ...}
    yields:
      match_ok: "boolean"
      cross_check_ok: "boolean"
      discrepancy: "string"
      gl_account: "string"
      cost_center: "string"
      confidence: "number"           # 0..1 — GL-coding confidence (floor forces < 0.7 on an invalid account)
      invoice_id: "string"
      vendor_id: "string"
      amount_cents: "number"
      anomaly_risk: "boolean"        # passthrough from intake — drives the approval matrix
      artifact_path: "string"
      match_retry_exhausted: "boolean"  # loop guard — true after the one allowed re-extraction
    inputs:
      upstream_yields: "object"
    playbook:
      - intent: code_entry
        description: "How to match, GL-code, and cross-check an invoice before approval."
        responsibility: |
          1. Match every line against the PO; when a 3-way match is required,
             reconcile invoice <-> PO <-> goods receipt. A line outside tolerance
             is a gap — the match fails; do not wave it through.
          2. Assign gl_account + cost_center from the vendor default or the
             line-item descriptions. Code ONLY to an account active in the chart.
          3. Re-check totals tie out to the source. If it does not, return to Ivy
             with the discrepancy — do not adjust a number to make it balance.
          4. Produce the coding sheet to ./out. Route to the approval tier the
             amount demands (the matrix is on the outbound wires).
        variables: [invoice_id]
    # ── THE APPROVAL MATRIX — explicit on the wires ──────────────────────────
    #   AP clerk autonomy ceiling:  $5,000   (500000 cents)
    #   Controller ceiling:         $50,000  (5000000 cents)
    #   GL-confidence floor:        0.7
    #   Dual sign-off:              above $500,000 (50000000 cents) — the CFO
    #     signs first, then Poe routes it to the Controller as second signer
    #     and posts only with both (enforced in agency/erp_poster_agent.py).
    # Anything anomalous or low-confidence escalates at least to the Controller
    # regardless of amount. Bounded back-edge to Ivy on a failed cross-check
    # (match_retry_exhausted counts the round in the session stash); on exhaustion
    # it terminates to the Finance-Ops Lead, never loops forever.
    can_call:
      - agent: invoice_intake_agent
        condition: "calling_agent_response.cross_check_ok == false and calling_agent_response.match_retry_exhausted == false"
      - agent: finance_ops_lead_human
        condition: "calling_agent_response.cross_check_ok == false and calling_agent_response.match_retry_exhausted == true"
      - agent: ap_clerk_human
        condition: "calling_agent_response.cross_check_ok == true and calling_agent_response.amount_cents < 500000 and calling_agent_response.confidence >= 0.7 and calling_agent_response.anomaly_risk == false"
      - agent: controller_human
        condition: "calling_agent_response.cross_check_ok == true and calling_agent_response.amount_cents < 5000000 and (calling_agent_response.amount_cents >= 500000 or calling_agent_response.confidence < 0.7 or calling_agent_response.anomaly_risk == true)"
      - agent: cfo_human
        condition: "calling_agent_response.cross_check_ok == true and calling_agent_response.amount_cents >= 5000000"

  # ─────────────────────────────────────────────────────────────────────────
  # Poe — ERP Poster & Ledger Liaison (programmatic FINISHER). Sits BEHIND the
  # human approval step. It never approves or pays — it re-checks that a human
  # actually approved (allow-token allowlist + block-token denylist; an UNKNOWN
  # verdict FAILS CLOSED), enforces deterministic invariants a human can't waive
  # (an invoice on record, a GL account, a positive amount), renders the posting
  # pack to ./out, DELETES it on a tripped floor, and records an append-only
  # ledger entry. After the HITL gate the upstream payload is dropped, so Poe
  # recovers the invoice from the session stash / dev store. See
  # agency/erp_poster_agent.py for the enforce_posting_floor.
  #
  # DUAL SIGN-OFF above $500,000: Poe records each approval (which seat, which
  # person) in the sign-off register. With only the CFO's approval it posts
  # nothing and routes the entry to the Controller as second signer. It posts
  # only when both the CFO and the Controller approved and they are two
  # different people (segregation of duties). Without a CFO approval on record
  # it blocks.
  # ─────────────────────────────────────────────────────────────────────────
  erp_poster_agent:
    name: erp_poster_agent
    communication_type: chain
    agent_type: programmatic
    description: "ERP Poster & Ledger Liaison — re-checks approval (two signers above $500K), posts the approved entry to the ERP, WORM ledger."
    yields:
      approved: "boolean"
      posted: "boolean"
      erp_entry_id: "string"
      pack_path: "string"
      status: "string"              # posted | blocked | awaiting_second_signature
      block_reasons: {type: array, items: string}
      signed_by: {type: array, items: string}   # approving seats on record, e.g. ["cfo_human", "controller_human"]
      awaiting_signer: "string"     # controller_human while a >$500K entry waits for its second signature
      invoice_id: "string"
      vendor_name: "string"
      amount_cents: "number"
    can_call:
      - agent: controller_human
        condition: "calling_agent_response.status == 'awaiting_second_signature'"
      - agent: audit_logger_agent
        condition: "calling_agent_response.status != 'awaiting_second_signature'"

  # ─────────────────────────────────────────────────────────────────────────
  # Human members — first-class, reached in the channel they already live in.
  # Nothing is approved or posted on silence. If nobody answers within the
  # seat's human_timeout_seconds, the request waits no longer: its Inbox card
  # closes and the ticket records that no reply came. Nobody is chased
  # automatically. fallback_on_timeout / fallback_response below declare the
  # intent (held_for_review -> audit); on leafmesh 2.4.486 a dual seat's
  # timeout does not route it yet.
  # dual belongs on the human/webhook boundary agent ONLY; the AI specialists
  # above are all `chain` (dual->dual is a footgun the SDK warns on). Humans
  # never call other humans (that would be dual->dual) — tier selection happens
  # upstream on Mat's approval matrix, and the second signer above $500K is
  # reached through Poe.
  # ─────────────────────────────────────────────────────────────────────────

  ap_clerk_human:
    name: ap_clerk_human
    agent_type: human
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: dual
    human_timeout_seconds: 14400    # 4 working hours — a routine sign-off or a question is answered the same half-day
    description: "AP Clerk — answers Ivy's targeted questions and signs off routine coding sheets (< $5K)."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    can_call:
      - agent: erp_poster_agent
        condition: "calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'approved'"
      - agent: invoice_intake_agent
        condition: "calling_agent_response.human_message == 'answered'"
      - agent: audit_logger_agent
        condition: "calling_agent_response.human_message == 'reject' or calling_agent_response.human_message == 'rejected' or calling_agent_response.human_message == 'hold' or calling_agent_response.human_message == 'held_for_review'"
    yields:
      human_message: "string"       # approve | answered | reject | hold | held_for_review
    inputs:
      question: "string"

  controller_human:
    name: controller_human
    agent_type: human
    human_interface: "default"   # the Inbox (no vault connection needed)
    # Dual sign-off above $500K needs to know WHO signed. Name the people who
    # hold this seat (their Studio logins) so the Inbox records the person on
    # each approval; without it Poe refuses to post above $500K.
    # operator_ids: ["controller@yourcompany.example"]
    communication_type: dual
    human_timeout_seconds: 28800    # 8 working hours — one business day
    description: "Controller — regulated sign-off for exceptions, $5K-$50K, low-confidence coding, or flagged risk; second signer above $500K."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    can_call:
      - agent: erp_poster_agent
        condition: "calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'approved'"
      # A reject or a hold is recorded in the audit sink and stops there.
      # No human->human wire; nobody is chased automatically.
      - agent: audit_logger_agent
        condition: "calling_agent_response.human_message == 'reject' or calling_agent_response.human_message == 'rejected' or calling_agent_response.human_message == 'hold' or calling_agent_response.human_message == 'held_for_review'"
    yields:
      human_message: "string"       # approve | reject | hold | held_for_review
    inputs:
      coding_sheet: "object"

  cfo_human:
    name: cfo_human
    agent_type: human
    human_interface: "default"   # the Inbox (no vault connection needed)
    # Dual sign-off above $500K needs to know WHO signed. Name the people who
    # hold this seat (their Studio logins) so the Inbox records the person on
    # each approval; without it Poe refuses to post above $500K.
    # operator_ids: ["cfo@yourcompany.example"]
    communication_type: dual
    human_timeout_seconds: 86400    # 24 hours — next business day, wherever the CFO is
    description: "CFO — high-value sign-off (>= $50K); first of two signers above $500K (the Controller signs second)."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    can_call:
      - agent: erp_poster_agent
        condition: "calling_agent_response.human_message == 'approve' or calling_agent_response.human_message == 'approved'"
      - agent: audit_logger_agent
        condition: "calling_agent_response.human_message == 'reject' or calling_agent_response.human_message == 'rejected' or calling_agent_response.human_message == 'hold' or calling_agent_response.human_message == 'held_for_review'"
    yields:
      human_message: "string"       # approve | reject | hold | held_for_review
    inputs:
      coding_sheet: "object"

  finance_ops_lead_human:
    name: finance_ops_lead_human
    agent_type: human
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: dual
    human_timeout_seconds: 259200   # 3 days
    description: "Accountable owner — reviews exceptions, owns policy calls, decides every gate. Everything that leaves the pod."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
    can_call:
      - agent: audit_logger_agent
        condition: "always"
    yields:
      human_message: "string"
    inputs:
      exception: "object"

  # ─────────────────────────────────────────────────────────────────────────
  # WORM audit sink — hash-chained, append-only, the terminus of every path.
  # Registered in main.py via sdk.intelligence("audit_logger_agent").
  # ─────────────────────────────────────────────────────────────────────────
  audit_logger_agent:
    name: audit_logger_agent
    agent_type: external
    framework: custom
    communication_type: chain
    description: "WORM audit — hash-chains every decision, post, approval, and held gate. Terminus."
    connector_config:
      sink_type: local_file
      local_file_path: "./logs/finance_audit.jsonl"
    can_call: []
