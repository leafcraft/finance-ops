version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: finance-ops-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  finance-ops:
    build: .
    container_name: finance-ops
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${LEAFMESH_PORT:-18820}:18820"
    volumes:
      - ./logs:/app/logs

volumes:
  redis-data:
